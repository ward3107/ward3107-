name: Deploy Solar Quote to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'solar-quote/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'solar-quote/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: solar-quote/package-lock.json
      - name: Build static site under the project-pages sub-path
        working-directory: solar-quote
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/solar-quote
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/solar-quote
          cp -R solar-quote/out/. _site/solar-quote/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="he" dir="rtl">
          <meta charset="utf-8">
          <title>Solar Quote</title>
          <meta http-equiv="refresh" content="0; url=./solar-quote/">
          <a href="./solar-quote/">מעבר ל־Solar Quote</a>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
