<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<title>LED promo — frame renderer (ar / he)</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Heebo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Palette: signal-yellow on near-black (road-sign legibility). White for copy. No greys, no textures, no big white fills. */
  :root{--u:1px;--ink:#08080b;--y:#ffd60a;--w:#ffffff;--soft:#ffffff;--panel:#16161c;--font:'Cairo',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow:hidden}
  body{position:fixed;inset:0;overflow:hidden;contain:paint;background:var(--ink);color:var(--w);font-family:var(--font)}
  body.he{--font:'Heebo',sans-serif}
  #road{position:absolute;left:0;right:0;bottom:calc(var(--u)*34);height:calc(var(--u)*10);
    background:repeating-linear-gradient(90deg,var(--y) 0 calc(var(--u)*90),transparent calc(var(--u)*90) calc(var(--u)*150))}
  /* traffic = the audience, passing by */
  .car{position:absolute;bottom:calc(var(--u)*50);width:calc(var(--u)*170);height:calc(var(--u)*66);will-change:transform}
  .car svg{width:100%;height:100%;overflow:visible}
  .scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;
    padding:calc(var(--u)*130) calc(var(--u)*90) calc(var(--u)*110)}
  .scene.on{display:flex}
  .a{opacity:0;will-change:transform}
  .y{color:var(--y)}
  #fx{position:absolute;inset:0;pointer-events:none}
  .pt{position:absolute;left:0;top:0;width:calc(var(--u)*24);height:calc(var(--u)*24);margin:calc(var(--u)*-12);background:var(--y);opacity:0;will-change:transform}
  .pt.w{background:#fff}
  .sk{position:absolute;height:calc(var(--u)*9);background:var(--y);border-radius:calc(var(--u)*5);display:none}
  #brand{position:absolute;top:calc(var(--u)*38);right:calc(var(--u)*60);display:flex;align-items:center;gap:calc(var(--u)*16);font-weight:800;font-size:calc(var(--u)*40)}
  #brand svg{width:calc(var(--u)*64);height:calc(var(--u)*44)}
  #tag{position:absolute;top:calc(var(--u)*34);left:calc(var(--u)*60);display:flex;align-items:center;gap:calc(var(--u)*14);direction:ltr;
    background:var(--y);color:#000;font-weight:900;font-size:calc(var(--u)*44);padding:calc(var(--u)*6) calc(var(--u)*26);border-radius:999px;letter-spacing:.02em}
  #tag svg{width:calc(var(--u)*34);height:calc(var(--u)*34)}
  /* S1 */
  .h1{font-size:calc(var(--u)*176);font-weight:900;line-height:1.15;white-space:nowrap}
  body.he .h1{font-size:calc(var(--u)*150)}
  .blk{display:inline-block;background:var(--y);color:#000;padding:calc(var(--u)*4) calc(var(--u)*56) calc(var(--u)*18);margin-top:calc(var(--u)*14);transform:skewX(-6deg)}
  .q{margin-top:calc(var(--u)*56);font-size:calc(var(--u)*68);font-weight:800;color:var(--soft);line-height:1.4}
  /* S2 */
  .s2h{font-size:calc(var(--u)*72);font-weight:900;line-height:1.3;margin-bottom:calc(var(--u)*34)}
  #s2{padding-top:calc(var(--u)*150);padding-bottom:calc(var(--u)*110)}
  .screens{display:flex;gap:calc(var(--u)*56);direction:ltr}
  .sw{position:relative;width:calc(var(--u)*640);height:calc(var(--u)*230)}
  .ring{position:absolute;inset:0;border:calc(var(--u)*8) solid var(--y);border-radius:calc(var(--u)*24);opacity:0}
  .screen{position:absolute;inset:0;border:calc(var(--u)*12) solid var(--y);border-radius:calc(var(--u)*22);overflow:hidden;background:#000}
  .screen .fill{position:absolute;inset:0;background:var(--y)}
  .screen .txt{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--u)*100);font-weight:900;color:#fff}
  body.he .screen .txt{font-size:calc(var(--u)*80)}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*30);margin-top:calc(var(--u)*34);width:100%;max-width:calc(var(--u)*1740)}
  .chip{background:var(--panel);border-top:calc(var(--u)*10) solid var(--y);padding:calc(var(--u)*18) calc(var(--u)*22) calc(var(--u)*20);border-radius:calc(var(--u)*12);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10)}
  .chip .ci{width:calc(var(--u)*64);height:calc(var(--u)*64);border-radius:50%;border:calc(var(--u)*4) solid var(--y);display:grid;place-items:center}
  .chip .ci svg{width:calc(var(--u)*38);height:calc(var(--u)*38);stroke:var(--y);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .chip .ct{font-size:calc(var(--u)*44);font-weight:800;line-height:1.3}
  /* S3 */
  .prices{display:flex;gap:calc(var(--u)*56);width:100%;max-width:calc(var(--u)*1700)}
  .pb{flex:1;display:flex;flex-direction:column;justify-content:space-between;border-radius:calc(var(--u)*28);padding:calc(var(--u)*50) calc(var(--u)*36);color:#000}
  .pb.w{background:#000;color:#fff;border:calc(var(--u)*10) solid #fff}
  .pb.yb{background:var(--y)}
  .pb .pq{font-size:calc(var(--u)*60);font-weight:900;line-height:1.3;min-height:2.6em;display:grid;place-items:center}
  .pb .pn{font-size:calc(var(--u)*210);font-weight:900;line-height:1.05;direction:ltr;margin-top:calc(var(--u)*6)}
  .pb .pn small{font-size:.5em;margin-inline-start:.12em}
  .pb .pu{font-size:calc(var(--u)*64);font-weight:800}
  .fine{margin-top:calc(var(--u)*38);max-width:calc(var(--u)*1600);font-size:calc(var(--u)*46);font-weight:800;color:var(--soft);line-height:1.55}
  /* S4 */
  .c1{font-size:calc(var(--u)*118);font-weight:900;line-height:1.2}
  .c2{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*22);font-size:calc(var(--u)*68);font-weight:800;color:var(--y);margin-top:calc(var(--u)*10)}
  .c2 svg{width:calc(var(--u)*76);height:calc(var(--u)*76);overflow:visible}
  .num{direction:ltr;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*34);margin-top:calc(var(--u)*30);font-size:calc(var(--u)*250);font-weight:900;color:var(--y);line-height:1}
  .num .d{width:calc(var(--u)*56);height:calc(var(--u)*16);background:var(--w);border-radius:calc(var(--u)*8)}
  .ul{height:calc(var(--u)*18);background:var(--y);margin:calc(var(--u)*30) auto 0;border-radius:calc(var(--u)*9)}
  .c3{margin-top:calc(var(--u)*34);font-size:calc(var(--u)*50);font-weight:900;color:var(--soft)}
  #wipe{position:absolute;top:-10%;bottom:-10%;left:50%;width:170vw;margin-left:-85vw;background:var(--y);display:none;will-change:transform}
  #black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="road"></div>
<div id="cars"></div>

<div id="brand"><svg viewBox="0 0 64 44" fill="none" stroke="#ffd60a" stroke-width="4" stroke-linejoin="round"><rect x="2" y="3" width="26" height="30" rx="4"/><rect x="36" y="3" width="26" height="30" rx="4"/><path d="M15 33v8M49 33v8" stroke-linecap="round"/></svg><span id="brandTxt"></span></div>
<div id="tag" class="a"><svg viewBox="0 0 24 24" fill="#000"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.6a1 1 0 01-.25 1z"/></svg><span>054-451-3141</span></div>

<section class="scene" id="s1">
  <div class="h1 a" id="h1a" data-t="-0.1" data-from="r"></div>
  <div class="h1 a" id="h1b" data-t="0.15" data-from="l"><span class="blk" id="h1bt"></span></div>
  <div class="q a" id="q" data-t="1.0" data-from="b" data-d="0.15"></div>
</section>

<section class="scene" id="s2">
  <div class="s2h a" id="s2h" data-t="0.3" data-from="t"></div>
  <div class="screens">
    <div class="sw a" id="scL" data-t="0.45" data-from="l"><div class="ring"></div><div class="screen"><div class="fill"></div><div class="txt"></div></div></div>
    <div class="sw a" id="scR" data-t="0.45" data-from="r"><div class="ring"></div><div class="screen"><div class="fill"></div><div class="txt"></div></div></div>
  </div>
  <div class="chips">
    <div class="chip a" id="ch0" data-t="1.7" data-from="r"></div>
    <div class="chip a" id="ch1" data-t="2.2" data-from="l"></div>
    <div class="chip a" id="ch2" data-t="2.7" data-from="r"></div>
  </div>
</section>

<section class="scene" id="s3">
  <div class="prices">
    <div class="pb w a" id="pA" data-t="0.3" data-from="r"><div class="pq" id="pAq"></div><div class="pn"><span id="nA">1,250</span><small>₪</small></div><div class="pu" id="pAu"></div></div>
    <div class="pb yb a" id="pB" data-t="0.55" data-from="l"><div class="pq" id="pBq"></div><div class="pn"><span id="nB">1,750</span><small>₪</small></div><div class="pu" id="pBu"></div></div>
  </div>
  <div class="fine a" id="fine" data-t="1.9" data-from="b" data-d="0.15"></div>
</section>

<section class="scene" id="s4">
  <div class="c1 a" id="c1" data-t="0.3" data-from="t"></div>
  <div class="c2 a" id="c2" data-t="1.3" data-from="b" data-d="0.2">
    <svg id="ph" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.6a1 1 0 01-.25 1z" fill="#ffd60a"/><path class="arc" d="M15 3.5a6.5 6.5 0 015.5 5.5" stroke="#ffd60a" stroke-width="1.8" stroke-linecap="round"/><path class="arc" d="M15 7a3.2 3.2 0 012.5 2.5" stroke="#ffd60a" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span id="c2t"></span>
  </div>
  <div class="num" id="num"><span class="a" id="g1" data-t="0.4" data-from="l">054</span><i class="d a" id="d1" data-t="0.5" data-from="s"></i><span class="a" id="g2" data-t="0.6" data-from="r">451</span><i class="d a" id="d2" data-t="0.7" data-from="s"></i><span class="a" id="g3" data-t="0.8" data-from="l">3141</span></div>
  <div class="ul a" id="ul" data-t="1.5" data-from="s"></div>
  <div class="c3 a" id="c3" data-t="2.1" data-from="b" data-d="0.2"></div>
</section>

<div id="fx"></div>
<div id="wipe"></div><div id="black"></div>

<script>
const LANG = new URLSearchParams(location.search).get('lang') === 'he' ? 'he' : 'ar';
const ICONS = [
  '<svg viewBox="0 0 24 24"><rect x="1.5" y="5" width="9.5" height="7" rx="1.2"/><rect x="13" y="5" width="9.5" height="7" rx="1.2"/><path d="M6.25 12v3M17.75 12v3M4 15.5h4.5M15.5 15.5H20"/></svg>',
  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>'
];
const T = {
  ar:{brand:'أبو عقل سنتر',h1a:'خلّي إعلان مشروعك',h1b:'يوصل للناس!',q:'عندك محل أو مشروع وبدك تعرّف الناس عليه؟',
      s2h:'اعرض إعلانك على <span class="y">شاشتين إعلانيتين</span><br>عند <span class="y">أبو عقل سنتر</span>',
      scr:'إعلانك',chips:['إعلانك بيظهر على الشاشتين بنفس الوقت','مدة الإعلان حوالي 10 ثواني','إمكانية تجهيز فيديو إعلاني بالذكاء الاصطناعي'],
      pAq:'عندك فيديو جاهز؟',pAu:'بالشهر',pBq:'بدك نجهّز لك الفيديو؟',pBu:'للشهر الأول',
      fine:'الأسعار تشمل ضريبة القيمة المضافة.<br>عدد مرات ظهور الإعلان يعتمد على عدد الإعلانات في الدورة.',
      c1:'للاستفسار والتفاصيل',c2:'تواصل معي على رقم العمل',c3:'أبو عقل سنتر · شاشتين إعلانيتين'},
  he:{brand:'אבו עקל סנטר',h1a:'הפרסום של העסק שלך',h1b:'מגיע לאנשים!',q:'יש לכם חנות או עסק ורוצים שאנשים יכירו אתכם?',
      s2h:'פרסמו על <span class="y">שני מסכי פרסום</span><br>ב<span class="y">אבו עקל סנטר</span>',
      scr:'המודעה שלך',chips:['המודעה שלכם מופיעה על שני המסכים בו-זמנית','משך המודעה כ-10 שניות','אפשרות להכנת סרטון פרסומי בבינה מלאכותית'],
      pAq:'יש לכם סרטון מוכן?',pAu:'לחודש',pBq:'רוצים שנכין לכם את הסרטון?',pBu:'לחודש הראשון',
      fine:'המחירים כוללים מע״מ.<br>מספר הופעות המודעה תלוי במספר המודעות במחזור.',
      c1:'לבירורים ופרטים',c2:'צרו קשר במספר העבודה',c3:'אבו עקל סנטר · שני מסכי פרסום'}
}[LANG];
const DUR = 18;
const SC = [{id:'s1',a:0,b:3.9},{id:'s2',a:3.9,b:8.7},{id:'s3',a:8.7,b:13.3},{id:'s4',a:13.3,b:DUR}];
const WIPE_HALF = 0.28;
// impact moments: particle burst + small camera thump (x,y in 1920x1080 space)
const IMPACTS = [{t:0.7,x:960,y:560},{t:4.95,x:960,y:520},{t:9.8,x:960,y:470},{t:14.55,x:960,y:640}];
const NP = 18;
// traffic: periods divide DUR so the loop is seamless
const CARS = [{p:6,o:0},{p:9,o:3},{p:4.5,o:1.1},{p:6,o:3.7}];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const outBack=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const outCubic=x=>1-Math.pow(1-clamp(x),3);
const inOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const $=id=>document.getElementById(id);
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const CAR_SVG='<svg viewBox="0 0 170 66" fill="#08080b" stroke="#ffd60a" stroke-width="5" stroke-linejoin="round"><path d="M8 46V36c0-5 3-8 8-9l26-5 20-14c3-2 6-3 10-3h40c6 0 10 2 13 6l12 16 21 4c4 1 7 4 7 8v10z"/><path d="M52 24l14-10h36l12 10z" stroke-width="4"/><circle cx="46" cy="50" r="13"/><circle cx="130" cy="50" r="13"/></svg>';

function setup(){
  document.documentElement.lang=LANG; document.body.classList.toggle('he',LANG==='he');
  document.documentElement.style.setProperty('--u',(innerWidth/1920)+'px');
  $('brandTxt').textContent=T.brand;
  $('h1a').textContent=T.h1a; $('h1bt').textContent=T.h1b; $('q').textContent=T.q;
  $('s2h').innerHTML=T.s2h;
  document.querySelectorAll('.screen .txt').forEach(e=>e.textContent=T.scr);
  T.chips.forEach((c,i)=>$('ch'+i).innerHTML='<div class="ci">'+ICONS[i]+'</div><div class="ct">'+c+'</div>');
  $('pAq').textContent=T.pAq; $('pAu').textContent=T.pAu; $('pBq').textContent=T.pBq; $('pBu').textContent=T.pBu;
  $('fine').innerHTML=T.fine; $('c1').textContent=T.c1; $('c2t').textContent=T.c2; $('c3').textContent=T.c3;
  CARS.forEach((c,i)=>{const d=document.createElement('div');d.className='car';d.id='car'+i;d.innerHTML=CAR_SVG;$('cars').appendChild(d)});
  IMPACTS.forEach((im,k)=>{for(let i=0;i<NP;i++){const d=document.createElement('i');d.className='pt'+(i%2?' w':'');d.id=`pt${k}_${i}`;$('fx').appendChild(d)}});
  for(let i=0;i<10;i++){const d=document.createElement('i');d.className='sk';d.id='sk'+i;$('fx').appendChild(d)}
}
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');

window.seek=function(t){
  const W=innerWidth, Hh=innerHeight, u=W/1920;
  $('road').style.backgroundPosition=(-t*350*u)+'px 0';   // 350px/s * 18s = 42 dash periods: seamless loop
  // traffic
  CARS.forEach((c,i)=>{const k=(((t+c.o)/c.p)%1+1)%1; const x=W+170*u-k*(W+340*u); $('car'+i).style.transform=`translateX(${x}px)`});
  const cur = SC.find(s=>t>=s.a && t<s.b) || SC[SC.length-1];
  SC.forEach(s=>{const el=$(s.id); el.classList.toggle('on',s===cur);
    if(s===cur){
      // slow push-in (alive, not static) + thump on impacts
      const push=1+0.04*((t-s.a)/(s.b-s.a)); let sx=0,sy=0;
      IMPACTS.forEach(im=>{const dt=t-im.t; if(dt>=0&&dt<.5){const a=11*u*Math.exp(-dt*11); sx+=a*Math.sin(dt*70); sy+=a*Math.cos(dt*58)}});
      el.style.transform=`translate(${sx}px,${sy}px) scale(${push})`;
    }});
  // entrances: each element slams in from its own side, alternating
  document.querySelectorAll('.a').forEach(el=>{
    const sc=el.closest('.scene'); if(!sc) return;
    const s=SC.find(x=>x.id===sc.id);
    const t0=s.a+ +el.dataset.t + (s.a>0?-0.1:0);
    const raw=(t-t0)/(+el.dataset.d||0.7);
    const p=outBack(raw), vis=clamp((t-t0)/0.12);
    const f=el.dataset.from; let tf='';
    const dx=W*0.85*(1-p);
    if(f==='l') tf=`translateX(${-dx}px)`; else if(f==='r') tf=`translateX(${dx}px)`;
    else if(f==='b') tf=`translateY(${(1-outCubic(raw))*120}px)`; else if(f==='t') tf=`translateY(${-(1-p)*Hh*0.35}px)`;
    else if(f==='s') tf=`scale(${0.2+0.8*p})`;
    // life after landing: price cards and tiles breathe
    if(el.id==='pA'||el.id==='pB'){ tf+=` translateY(${Math.sin(t*2.2+(el.id==='pB'?1.6:0))*6*u*clamp(raw-1)}px)`}
    if(el.id==='ul') tf=`scaleX(${clamp(raw)})`, el.style.width=(1280*u)+'px';
    if(el.id==='c2'||el.id==='c3') { /* handled via .a generic */ }
    el.style.opacity=vis; el.style.transform=tf;
  });
  // phone tag (scenes 1-3)
  const tg=$('tag'), tIn=clamp((t-1.4)/0.5), tOut=t>=13.3-WIPE_HALF?0:1;
  tg.style.opacity=tIn*tOut; tg.style.transform=`translateY(${-(1-outCubic((t-1.4)/0.5))*80}px)`;
  // screens: same-beat pulse + broadcast rings
  const ph=((t-4.9)%2.4+2.4)%2.4, pulse=t<4.9?0:0.55*Math.max(0,1-ph/1.0);
  const rk=t<4.9?1:clamp(ph/1.5);
  document.querySelectorAll('.sw').forEach(sw=>{
    sw.querySelector('.fill').style.opacity=pulse;
    const r=sw.querySelector('.ring'); r.style.opacity=t<4.9?0:0.7*(1-rk); r.style.transform=`scale(${1+0.16*outCubic(rk)})`;
  });
  // price count-up
  const cu=(a,b)=>fmt(b*outCubic((t-a)/0.9));
  $('nA').textContent=t<8.9?'0':cu(9.0,1250);
  $('nB').textContent=t<8.9?'0':cu(9.25,1750);
  // ringing phone + number pulse (last scene)
  const rt=t-14.9, ringOn=rt>0&&(rt%1.4)<0.6;
  $('ph').style.transform=`rotate(${ringOn?Math.sin(rt*60)*14:0}deg)`;
  document.querySelectorAll('.arc').forEach((a,i)=>a.style.opacity=ringOn?(0.35+0.65*Math.abs(Math.sin(rt*14+i*1.2))):0.25);
  $('num').style.transform=`scale(${t>15.0?1+0.028*Math.abs(Math.sin(Math.PI*(t-15.0)/1.4)):1})`;
  // particle bursts where things collide / land
  IMPACTS.forEach((im,k)=>{
    const dt=t-im.t, kk=dt/0.9;
    for(let i=0;i<NP;i++){
      const el=$(`pt${k}_${i}`);
      if(dt<0||dt>0.9){el.style.opacity=0;continue}
      const ang=(i/NP)*Math.PI*2+rnd(k*31+i)*0.5, sp=(260+rnd(k*7+i*3)*420)*u;
      const d=sp*(1-Math.pow(1-clamp(kk),2))*0.9;
      el.style.opacity=1-kk;
      el.style.transform=`translate(${(im.x*u)+Math.cos(ang)*d}px,${(im.y*u)+Math.sin(ang)*d}px) rotate(${45+kk*200}deg) scale(${1-0.6*kk})`;
    }
  });
  // swipe between scenes (right -> left); speed lines trail it
  const w=$('wipe'); let wx=null,wk=0;
  for(const s of SC.slice(1)){ if(Math.abs(t-s.a)<=WIPE_HALF){ wk=(t-(s.a-WIPE_HALF))/(2*WIPE_HALF); wx=(1-2*inOut(wk))*150 } }
  if(wx===null){w.style.display='none'} else {w.style.display='block';w.style.transform=`translateX(${wx}vw) skewX(-14deg)`}
  for(let i=0;i<10;i++){
    const s=$('sk'+i);
    if(wx===null){s.style.display='none';continue}
    const edge=(wx*W/100)+0.85*W;               // right (trailing) edge of the panel in px
    const len=(380+rnd(i*5)*620)*u, y=(110+i*92+rnd(i)*30)*u;
    s.style.display='block'; s.style.top=y+'px'; s.style.width=len*clamp(wk*2.2)+'px'; s.style.left=(edge-20*u)+'px';
  }
  // fade to black only at the very end (loop point); first frame already has action
  $('black').style.opacity=clamp((t-(DUR-0.3))/0.3);
};
window.DUR=DUR;
document.fonts.ready.then(()=>{setup();window.seek(0);window.READY=true});
</script>
